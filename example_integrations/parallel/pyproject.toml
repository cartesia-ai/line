[project]
name = "parallel-web-search"
version = "0.1.0"
description = "A web research voice agent using Parallel Free Search MCP and Cartesia Line SDK"
requires-python = ">=3.10"
dependencies = [
    "cartesia-line==0.2.17",
    "mcp>=1.0.0,<2",
]

[project.scripts]
parallel-search = "main:app.run"
