[project]
name = "keenable-web-search"
version = "0.1.0"
description = "A web research voice agent using the Keenable API and Cartesia Line SDK (keyless by default)"
requires-python = ">=3.10"
dependencies = [
    "cartesia-line==0.2.16",
    "httpx>=0.27",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
keenable-search = "main:app.run"
